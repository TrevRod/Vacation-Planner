name: Build Mobile Apps
on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Platform Dependencies
        run: |
          npm install --legacy-peer-deps || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
      - name: Build Standalone Workspace
        run: |
          mkdir -p out && touch out/index.html
          npx cap add android || true
          npx cap sync android
          
      - name: Compile Native Android APK
        run: |
          cd android && ./gradlew assembleDebug
          
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Platform Dependencies & CocoaPods
        run: |
          npm install --legacy-peer-deps || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          sudo gem install cocoapods || true
          
      - name: Force Create Native Workspace
        run: |
          mkdir -p out && touch out/index.html
          # Force initialization to ensure the 'ios' folder and Podfile are created
          npx cap add ios
          npx cap sync ios
          
      - name: Compile Native iOS Application
        run: |
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath ./build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          
      - name: Compress iOS Artifact
        run: |
          cd ios/App/build/Build/Products/Debug-iphonesimulator
          zip -r ../../../../MyAIStudioApp.zip App.app
          
      - name: Upload iOS App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-app
          path: MyAIStudioApp.zip
