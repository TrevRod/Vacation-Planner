name: Build Mobile Apps
on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
      - name: Fix Missing Web Dir
        run: mkdir -p out dist public && touch out/index.html dist/index.html public/index.html
          
      - name: Initialize Capacitor Android
        run: |
          npx cap sync android || true
          npx cap add android || true
          npx cap copy android
          
      - name: Build Android APK
        run: |
          cd android && ./gradlew assembleDebug
          
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          
      - name: Fix Missing Web Dir
        run: mkdir -p out dist public && touch out/index.html dist/index.html public/index.html
          
      - name: Initialize Capacitor iOS
        run: |
          npx cap sync ios || true
          npx cap add ios || true
          npx cap copy ios
          
      - name: Build iOS App Bundle
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          
      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-app
          path: ios/App/build/Release-iphonesimulator/App.app
