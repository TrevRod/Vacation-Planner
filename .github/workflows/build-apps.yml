name: Build Mobile Apps
on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
      - name: Create Web Placeholder & Initialize Android
        run: |
          mkdir -p out dist public && touch out/index.html dist/index.html public/index.html
          npx cap init MyAIStudioApp com.yourname.myapp --web-dir=out --skip-user-prompts || true
          npx cap add android || true
          npx cap sync android
          
      - name: Build Android APK
        run: |
          cd android && ./gradlew assembleDebug
          
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install Dependencies & CocoaPods
        run: |
          npm install --legacy-peer-deps || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          sudo gem install cocoapods || true
          
      - name: Create Web Placeholder & Initialize iOS
        run: |
          mkdir -p out dist public && touch out/index.html dist/index.html public/index.html
          npx cap init MyAIStudioApp com.yourname.myapp --web-dir=out --skip-user-prompts || true
          npx cap add ios || true
          npx cap sync ios
          
      - name: Build iOS App for Simulator (Skips Provisioning)
        run: |
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath ./build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          
      - name: Zip and Compress iOS App Bundle
        run: |
          cd ios/App/build/Build/Products/Debug-iphonesimulator
          zip -r ../../../../MyAIStudioApp.zip App.app
          
      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-app
          path: MyAIStudioApp.zip
