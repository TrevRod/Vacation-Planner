name: Build Mobile Apps
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
          
      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install Project Dependencies
        run: |
          bun install
          bun run build
          
      - name: Build Standalone Android Project
        run: |
          npx cap add android || true
          npx cap sync android
          
      - name: Compile Native Android APK and AAB Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          # Compile Android App Bundle (.aab) for Google Play
          ./gradlew bundleDebug
          
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Android App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: android/app/build/outputs/bundle/**/*.aab

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install Project Dependencies
        run: |
          bun install
          bun run build
          
      - name: Initialize iOS Platform
        run: |
          npx cap add ios || true
          npx cap sync ios
          
      - name: Compile Native iOS Application
        run: |
          cd ios/App
          # Capacitor 8 uses Swift Package Manager (SPM) by default instead of CocoaPods.
          # Only run pod install if a legacy Podfile actually exists.
          if [ -f "Podfile" ]; then
            pod install
          fi
          
          # Target workspace if available, otherwise project
          if [ -d "App.xcworkspace" ]; then
            TARGET_ARG="-workspace App.xcworkspace"
          else
            TARGET_ARG="-project App.xcodeproj"
          fi
          
          xcodebuild $TARGET_ARG -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath ./build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          
      - name: Compress iOS Artifact
        run: |
          cd ios/App
          APP_PATH=$(find ./build -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ./build -name "*.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          zip -r ../../MyAIStudioApp.zip "$APP_PATH"
          
      - name: Upload iOS App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-app
          path: MyAIStudioApp.zip
